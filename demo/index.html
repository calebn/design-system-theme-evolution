<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Tokens Pipeline Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Default brand/version: loaded by App.tsx on mount; this prevents FOUC -->
    <link id="theme-css" rel="stylesheet" href="./generated/versions/1.0.0/logos/variables.css" />
    <!-- Prism.js — syntax highlighting for code blocks (Tomorrow Night theme) -->
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js" defer></script>
    <style>
      /* Override Prism background to match our dark code blocks */
      pre[class*="language-"], code[class*="language-"] {
        background: none !important;
        text-shadow: none !important;
      }
      /* High-contrast Prism token colors (VSCode Dark+ inspired) */
      .token.property,
      .token.tag,
      .token.boolean,
      .token.constant,
      .token.symbol,
      .token.deleted {
        color: #9cdcfe !important; /* bright cyan for JSON keys / properties */
      }
      .token.string,
      .token.attr-value,
      .token.char,
      .token.builtin,
      .token.inserted {
        color: #ce9178 !important; /* warm orange for string values */
      }
      .token.number,
      .token.unit {
        color: #b5cea8 !important; /* muted green for numbers */
      }
      .token.punctuation,
      .token.operator {
        color: #d4d4d4 !important; /* light gray for punctuation */
      }
      .token.keyword,
      .token.selector,
      .token.important {
        color: #c586c0 !important; /* magenta for keywords */
      }
      .token.function,
      .token.class-name {
        color: #dcdcaa !important; /* yellow for function/class names */
      }
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata {
        color: #6a9955 !important; /* green for comments */
      }
      /* Highlighted line mark */
      mark.code-highlight {
        display: inline;
        background: rgba(250, 204, 21, 0.15);
        border-left: 3px solid #facc15;
        margin-left: -16px;
        padding-left: 13px;
        color: inherit;
      }
      /* Sticky controls slide-in */
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
