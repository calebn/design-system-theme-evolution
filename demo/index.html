<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Tokens Pipeline Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Default brand/version: loaded by App.tsx on mount; this prevents FOUC -->
    <!-- Use %BASE_URL% so Vite serves this from public/ instead of bundling it as a source CSS file -->
    <link id="theme-css" rel="stylesheet" href="%BASE_URL%generated/versions/1.0.0/logos/variables.css" />
    <!-- Prism.js — syntax highlighting for code blocks (Tomorrow Night theme) -->
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js" defer></script>
    <style>
      /* Override Prism background — code blocks use our own background color */
      pre[class*="language-"], code[class*="language-"] {
        background: none !important;
        text-shadow: none !important;
        color: #24292f !important; /* GitHub dark default text */
      }
      /* GitHub-style light syntax token colors */
      .token.property,
      .token.tag,
      .token.boolean,
      .token.constant {
        color: #0550ae !important; /* deep blue for JSON keys / properties */
      }
      .token.string,
      .token.attr-value,
      .token.char,
      .token.builtin,
      .token.inserted {
        color: #0a3069 !important; /* dark blue-green for strings */
      }
      .token.number,
      .token.unit {
        color: #116329 !important; /* dark green for numbers */
      }
      .token.punctuation,
      .token.operator {
        color: #24292f !important; /* near-black for punctuation */
      }
      .token.keyword,
      .token.selector,
      .token.important {
        color: #cf222e !important; /* GitHub red for keywords */
      }
      .token.function,
      .token.class-name {
        color: #8250df !important; /* purple for function/class names */
      }
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata {
        color: #6e7781 !important; /* gray for comments */
      }
      .token.symbol,
      .token.deleted {
        color: #cf222e !important;
      }
      /* Highlighted line mark (for light background) */
      mark.code-highlight {
        display: inline;
        background: rgba(255, 200, 0, 0.2);
        border-left: 3px solid #e6a817;
        margin-left: -16px;
        padding-left: 13px;
        color: inherit;
      }
      /* Sticky controls slide-in */
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
